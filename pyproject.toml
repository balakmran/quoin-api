[project]
name = "quoin-api"
version = "0.12.0"
description = "The Foundation for your Python backend API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Balakumaran Manoharan", email = "bala@balakmran.dev" }
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]==0.141.1",
    "greenlet==3.5.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-httpx>=0.63b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1",
    "opentelemetry-sdk>=1.42.1",
    "psycopg[binary]==3.3.5",
    "purgatory>=3.0.1",
    "pydantic-settings>=2.14.2",
    "PyJWT[crypto]>=2.13.0",
    "sqlmodel==0.0.42",
    "stamina>=26.1.0",
    "structlog>=26.1.0",
]

[project.urls]
Repository = "https://github.com/balakmran/quoin-api"
Documentation = "https://balakmran.github.io/quoin-api/"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "test" },
    { include-group = "tooling" },
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical==0.0.58",
]
test = [
    "httpx2>=2.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
tooling = [
    "prek==0.5.2",
    "ruff==0.16.6",
    "ty==0.0.78",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
# Only applies where --cov is passed (just test / just check); a bare
# `pytest tests/foo.py` is unaffected.
fail_under = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF", "D", "N"]
ignore = ["D100", "D104"] # Ignore missing docstring in public module/package
pydocstyle.convention = "google"

# The formatter wraps at 80; E501 fires only past 100. Copier substitutes
# the settings prefix into docstrings and comments, which no formatter
# reflows, so the slack keeps long project names lint-clean. Write to 80.
[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Security",
    "fastapi.Header",
]

[tool.uv]
required-version = ">=0.11.19"
# exclude-newer = "7 days"
