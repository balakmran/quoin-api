name: Copier Update Check

# Verifies the template's `copier update` path still works across a real
# release: generate from the previous tag, update to this one, and run
# the updated project's own `just check`. Tags only — `scaffold-smoke.yml`
# covers fresh generation on every pull request; this one costs a second
# generation plus a full gate, and has nothing to compare against until a
# release boundary exists.

on:
  push:
    tags:
      - "v*"

jobs:
  verify-update:
    name: Verify copier update path
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # The *generated* project's prefix, not this repo's QUOIN_ — the
      # script generates with `--defaults`, so `env_prefix` is QUOINAPI.
      QUOINAPI_ENV: test
      QUOINAPI_POSTGRES_HOST: localhost
      QUOINAPI_POSTGRES_PORT: 5432
      QUOINAPI_POSTGRES_USER: postgres
      QUOINAPI_POSTGRES_PASSWORD: postgres
      QUOINAPI_POSTGRES_DB: postgres

    steps:
      - name: Checkout with full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine previous release tag
        id: tags
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # versionsort.suffix sorts v1.0.0-rc.N below v1.0.0; without it
          # the first patch after 1.0.0 would verify from an rc tag.
          PREV_TAG=$(git -c versionsort.suffix=-rc tag --sort=-v:refname | awk -v cur="$CURRENT_TAG" 'found{print; exit} $0==cur{found=1}')
          echo "current=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "previous=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV_TAG" ]; then
            echo "No earlier release tag found — this is the first release, nothing to verify an update from."
          fi

      - name: Install uv
        if: steps.tags.outputs.previous != ''
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        if: steps.tags.outputs.previous != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install just
        if: steps.tags.outputs.previous != ''
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        if: steps.tags.outputs.previous != ''
        run: just install

      - name: Verify copier update from the previous release
        if: steps.tags.outputs.previous != ''
        env:
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous }}
          CURRENT_TAG: ${{ steps.tags.outputs.current }}
        # `--check` runs the updated project's own gate. Without it this
        # proves only that the update applied, not that what the adopter
        # is left holding still works.
        run: |
          just verify-template-update "$PREVIOUS_TAG" "$CURRENT_TAG" --check
