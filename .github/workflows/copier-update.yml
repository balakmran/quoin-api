name: Copier Update Check

# Verifies the template's `copier update` path still works across a real
# release: generate from an earlier tag, update to this one, and run
# the updated project's own `just check`. Tags only — `scaffold-smoke.yml`
# covers fresh generation on every pull request; this one costs a second
# generation plus a full gate, and has nothing to compare against until a
# release boundary exists.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  select-tags:
    name: Select tags to update from
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.tags.outputs.previous }}

    steps:
      - name: Checkout with full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine previous release tags
        id: tags
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        # A JSON list: the preceding tag, then the newest final release
        # before it (adopters sit on finals, not candidates).
        # versionsort.suffix sorts v1.0.0-rc.N below v1.0.0.
        run: |
          PREV_TAGS=$(git -c versionsort.suffix=-rc tag --sort=-v:refname | awk -v cur="$CURRENT_TAG" 'found==1{t[n++]=$0; found=2; next} found==2 && !/-rc\./{t[n++]=$0; exit} $0==cur{found=1} END{printf "["; for(i=0;i<n;i++) printf "%s\"%s\"", (i?",":""), t[i]; print "]"}')
          echo "previous=$PREV_TAGS" >> "$GITHUB_OUTPUT"
          if [ "$PREV_TAGS" = "[]" ]; then
            echo "No earlier release tag found — this is the first release, nothing to verify an update from."
          fi

  verify-update:
    name: Verify copier update from ${{ matrix.previous }}
    needs: select-tags
    if: needs.select-tags.outputs.previous != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        previous: ${{ fromJSON(needs.select-tags.outputs.previous) }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # The *generated* project's prefix, not this repo's QUOIN_ — the
      # script generates with `--defaults`, so `env_prefix` is QUOINAPI.
      QUOINAPI_ENV: test
      QUOINAPI_POSTGRES_HOST: localhost
      QUOINAPI_POSTGRES_PORT: 5432
      QUOINAPI_POSTGRES_USER: postgres
      QUOINAPI_POSTGRES_PASSWORD: postgres
      QUOINAPI_POSTGRES_DB: postgres

    steps:
      - name: Checkout with full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same uv as the Dockerfile; test_tool_pins.py keeps them equal.
          version: "0.12.17"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just install

      - name: Verify copier update from the earlier release
        env:
          PREVIOUS_TAG: ${{ matrix.previous }}
          CURRENT_TAG: ${{ github.ref_name }}
        # `--check` runs the updated project's own gate. Without it this
        # proves only that the update applied, not that what the adopter
        # is left holding still works.
        run: |
          just verify-template-update "$PREVIOUS_TAG" "$CURRENT_TAG" --check
