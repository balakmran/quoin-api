name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      QUOIN_ENV: test
      QUOIN_POSTGRES_HOST: localhost
      QUOIN_POSTGRES_PORT: 5432
      QUOIN_POSTGRES_USER: postgres
      QUOIN_POSTGRES_PASSWORD: postgres
      QUOIN_POSTGRES_DB: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same uv as the Dockerfile; test_tool_pins.py keeps them equal.
          version: "0.11.26"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just install

      - name: Run quality checks
        run: just check

  python-floor:
    # A separate job, not a matrix entry: a matrix renames "Quality
    # Checks", which the main ruleset requires by name.
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      QUOIN_ENV: test
      QUOIN_POSTGRES_HOST: localhost
      QUOIN_POSTGRES_PORT: 5432
      QUOIN_POSTGRES_USER: postgres
      QUOIN_POSTGRES_PASSWORD: postgres
      QUOIN_POSTGRES_DB: postgres
      # The requires-python floor; overrides .python-version for uv.
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just install

      # Format, lint, and typecheck don't vary by interpreter.
      - name: Run tests
        run: just test
