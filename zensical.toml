[project]
site_name = "QuoinAPI"
site_url = "https://balakmran.github.io/quoin-api/"
site_description = "Built for teams who ship, not configure. A production-ready FastAPI template."
site_author = "Balakumaran Manoharan"
copyright = "&copy; 2026 balakmran"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
repo_url = "https://github.com/balakmran/quoin-api"
repo_name = "balakmran/quoin-api"
nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "guides/getting-started.md" },
    { "Build" = [
        "guides/build.md",
        { "Creating a Module" = "guides/creating-a-module.md" },
        { "Database Migrations" = "guides/database-migrations.md" },
        { "Authentication" = "guides/authentication.md" },
        { "Pagination & Filtering" = "guides/pagination.md" },
        { "Soft Delete" = "guides/soft-delete.md" },
        { "Outbound HTTP Client" = "guides/outbound-http.md" },
    ]},
    { "API Design" = [
        "guides/api-design.md",
        { "Error Handling" = "guides/error-handling.md" },
        { "Optimistic Concurrency" = "guides/optimistic-concurrency.md" },
        { "Deprecating Endpoints" = "guides/deprecating-endpoints.md" },
    ]},
    { "Ship" = [
        "guides/ship.md",
        { "Testing" = "guides/testing.md" },
        { "Quality Checks" = "guides/quality-checks.md" },
        { "AI-Assisted Development" = "guides/ai-setup.md" },
        { "Configuration" = "guides/configuration.md" },
        { "Security" = "guides/security.md" },
        { "Dependency Scanning" = "guides/dependency-scanning.md" },
        { "Deployment" = "guides/deployment.md" },
        { "Observability" = "guides/observability.md" },
        { "Troubleshooting" = "guides/troubleshooting.md" },
    ]},
    { "Architecture" = [
        "architecture/overview.md",
        { "Decision Log" = "architecture/decision-log.md" },
    ]},
    { "Reference" = [
        "api/overview.md",
        { "Conventions" = "api/conventions.md" },
        { "Core" = "api/core.md" },
        { "User" = "api/user.md" },
        { "System" = "api/system.md" },
    ]},
    { "Project" = [
        "project.md",
        { "Staying Current" = "guides/staying-current.md" },
        { "API Stability & SemVer" = "guides/api-stability.md" },
        { "Release Notes" = "project/changelog.md" },
        { "Roadmap" = "project/roadmap.md" },
        { "Release Workflow" = "guides/release-workflow.md" },
        { "Contributing" = "project/contributing.md" },
        { "Security Policy" = "project/security-policy.md" },
        { "License" = "project/license.md" },
    ]},
]
extra_css = [
    "stylesheets/extra.css",
    "stylesheets/home.css",
]
extra_javascript = [
    "javascripts/home.js",
]

[project.theme]
name = "material"
language = "en"
logo = "assets/logo.svg"
features = [
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "navigation.path",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.expand",
    "navigation.indexes",
    "toc.follow",
    "content.code.copy",
    "search.suggest",
    "search.highlight",
    "search.share",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "black"
accent = "blue"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "black"
accent = "blue"

[project.extra]
generator = false

[project.extra.analytics]
provider = "google"
property = "G-GQ3W2J8ELX"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/balakmran"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/balakmran"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/balakmran"

[project.markdown]
extensions = [
    "meta",
    { "pymdownx.highlight" = { anchor_linenums = true } },
    "pymdownx.superfences",
    "pymdownx.inlinehilite",
    "pymdownx.snippets",
    "admonition",
    "pymdownx.details",
    { "pymdownx.tabbed" = { alternate_style = true } },
    { "pymdownx.tasklist" = { custom_checkbox = true } },
]

[project.plugins.search]

[project.plugins.social]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
# Each reference section keeps its own human-readable `##` heading, so
# the generated block starts at the members rather than repeating the
# dotted module path.
show_root_heading = false
show_root_toc_entry = false
heading_level = 3
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
# Hide dunders (`__init__`, `__call__`) and privates; the constructor's
# arguments are shown on the class instead.
filters = ["!^_"]
merge_init_into_class = true
