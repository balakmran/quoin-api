## Copier Configuration
## https://copier.readthedocs.io/

project_name:
  type: str
  default: "QuoinAPI"
  help: "The display name of the API (e.g. My Awesome API)"

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  help: "The string used in URLs, folders, etc (e.g. my-awesome-api)"

env_prefix:
  type: str
  default: "{{ project_name | upper | replace(' ', '_') | replace('-', '_') }}"
  help: "Prefix for environment variables (e.g. MYAPI)"

description:
  type: str
  default: "The Foundation for your Python backend API."
  help: "Short description for OpenAPI and pyproject.toml"

long_description:
  type: str
  default: "{{ project_name }} is a production-ready Python backend foundation built with FastAPI, SQLModel, and the Astral stack (uv, ruff, ty)."
  help: "Long descriptive string for OpenAPI documentation"

author_name:
  type: str
  default: "Balakumaran Manoharan"
  help: "Your name for copyrights and package metadata"

author_email:
  type: str
  default: "bala@balakmran.dev"
  help: "Your email for package metadata"

github_username:
  type: str
  default: "balakmran"
  help: "Your GitHub username"

google_analytics_id:
  type: str
  default: ""
  help: "Google Analytics measurement ID (e.g. G-XXXXXXXXXX). Leave empty to disable."

_exclude:
  - ".git"
  - ".venv"
  - "__pycache__"
  - "site"
  - ".cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".coverage"
  - "htmlcov"
  - ".idea"
  - ".vscode"
  - "uv.lock"
  # QuoinAPI-specific docs/meta pages — not relevant to a fresh project.
  # (index.md, zensical.toml nav, and README are rewritten by the
  # post-generation script in scripts/copier_setup.py.jinja.)
  - "docs/docs.md"
  - "docs/architecture/decision-log.md"
  - "docs/project/roadmap.md"
  - "docs/project/changelog.md"
  - "docs/javascripts/home.js"
  - "ROADMAP.md"
  # Template-maintenance CI. A generated project is not a template --
  # copier.yml self-destructs during setup -- so these two only ever
  # fail there. Their QUOINAPI_* service variables are not rewritten
  # either: the substitution key is "QUOIN_", and "QUOINAPI_ENV" does
  # not contain it, so they would point an adopter's gate at a prefix
  # their project never reads.
  - ".github/workflows/scaffold-smoke.yml"
  - ".github/workflows/copier-update.yml"
  # Template-maintenance tooling. A generated project is not a
  # template: the script verifies `copier update` between two tags of
  # this repo, and both tests already skip themselves once the setup
  # script is gone. The `just verify-template-update` recipe and the
  # prose around it are fenced `# template-only` and stripped instead.
  - "scripts/verify_template_update.py"
  - "tests/test_template_substitution.py"
  - "tests/test_copier_update_workflow.py"
  # The home page's own styling, and every screenshot of this
  # template's UI. clean_index() replaces the markup the stylesheet
  # targets, and strip_screenshots() drops the embeds.
  - "docs/stylesheets/home.css"
  - "docs/assets/images/*"

_tasks:
  - "python3 scripts/copier_setup.py"
